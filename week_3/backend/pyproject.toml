[project]
name = "backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.48.0",
    "python-multipart",
    "python-dotenv>=1.2.2",
    "pydantic>=2.6.0",
    "google-genai",
    "ollama",
    "pypdf",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
# app.py imports the shared modules from week_2, exactly as they are laid out in Docker.
pythonpath = ["src", "../../week_2"]
testpaths = ["tests"]
