services:
  frontend:
    build: ./frontend
    ports:
      - "80:8000"
    environment:
      # Read by the browser, so it points at the host-published backend port.
      BACKEND_URL: http://localhost:8001/chat
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ..                         # repo root, so the image can include week_2/
      dockerfile: week_3/backend/Dockerfile
    ports:
      - "8001:8000"
    env_file: .env                        # GEMINI_API_KEY, LLM_MODEL, OLLAMA_HOST
    environment:
      DATABASE_PATH: /app/data/jobs_d1.db
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    volumes:
      - ../week_2/data:/app/data:ro       # the tagged jobs warehouse, read-only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
